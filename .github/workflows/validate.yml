name: Validate files

on: push

jobs:
  validate-files:
    runs-on: self-hosted
    steps:
      - name: get-repo-code
        uses: actions/checkout@v5

      - name: Validate html file
        run: test -f index.html

      - name: Validate script file
        run: test -f script.js

      - name: Validate js code
        run: node  --check script.js

      - name: fail job intentionally
        run: exit 0 #means job fail if 0 then job passed